<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"

    />
    <!-- AOS Animation CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
      rel="stylesheet"
    />

    
    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="DashboardStyle.css" />
    <title>Play Using CloudColors Dashboard</title>
   
  </head>
  <body class="conatiner-fluid">
 <h3 class="d-flex align-items-center justify-content-between col-12 p-4 m-0" id="heading">
  <span>
    <i class="fa-solid fa-palette"></i>
    CloudColors Dashboard
    <img
      src="colored-pencils.png"
      alt="loading"
      class="img img-fluid w-30"
      id="headingId"
    />
  </span>

  <span class="d-flex" id="textActions">
    <button type="button" class="btn me-2" id="deleteText" aria-label="Delete">
      <i class="fa-solid fa-trash"></i> 
    </button>
    <button type="button" class="btn" id="shareText" aria-label="Share ScreenShot">
       <i class="fa-solid fa-cloud-arrow-down"></i>
    </button>
  </span>
  
</h3>

   
    <div class="Middlebuttons d-flex overflow-auto mt-0">
      
      <div
        id="colorMenuCarousel"
        class="carousel slide col-lg-12 col-md-12 col-sm-12 col-xs-12 m-0"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner">
          <!-- Slide 1 -->
          <div class="carousel-item active">
            <div class="d-flex justify-content-around">
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown " >
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown"  aria-expanded="false" id="darkBtn">
                  <i class="fa-solid fa-lightbulb"></i>
                  Dark Colors</button>
                <ul class="dropdown-menu " aria-labelledby="darkBtn"> 
                  <li> <div class="palette d-none " id="darkPalette"></div> </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                id="lightBtn">
                <i class="fa-regular fa-lightbulb"></i>
                Light Colors</button>
                <ul class="dropdown-menu " aria-labelledby="lightBtn"> 
                  <li> <div class="palette d-none" id="lightPalette"></div>  </li> 
                </ul>
                  
              </div>
               <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="neutralBtn">
                  <i class="fa-solid fa-circle-half-stroke"></i>
                  Neutral Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="neutralBtn"> 
                  <li> <div class="palette d-none" id="neutralPalette"></div>  </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown"
                 aria-expanded="false" id="pastelBtn">
                  <i class="fas fa-heart pastel-icon"></i>
                 Pastel Colors</button>
                 <ul class="dropdown-menu " aria-labelledby="pastelBtn"> 
                  <li> <div class="palette d-none" id="pastelPalette"></div>  </li> 
                </ul>
              </div>
               <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="oceanBtn">
                  <i class="fa-solid fa-water"></i>
                  Ocean Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="oceanBtn"> 
                  <li> <div class="palette d-none" id="oceanPalette"></div>  </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" id="earthBtn">
                  <i class="fas fa-earth-americas"></i>
                  Earth Tones</button>
                <ul class="dropdown-menu " aria-labelledby="earthBtn"> 
                  <li> <div class="palette d-none" id="earthPalette"></div>  </li> 
                </ul>
              </div>
            </div>
          </div>

          <!-- Slide 2 -->
          <div class="carousel-item">
            <div class="d-flex justify-content-around">
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="tertiaryBtn">
                  <i class="fas fa-star tertiary-color"></i>
                  Tertiary Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="tertiaryBtn"> 
                  <li> <div class="palette d-none" id="tertiaryPalette"></div>  </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="warmBtn">
                  <i class="fa-solid fa-temperature-arrow-up"></i>
                  Warm Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="warmBtn"> 
                  <li> <div class="palette d-none" id="warmPalette"></div>  </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle"  data-bs-toggle="dropdown" aria-expanded="false" 
                 id="coolBtn">
                 <i class="fa-solid fa-fan"></i>
                 Cool Colors</button>
                 <ul class="dropdown-menu " aria-labelledby="coolBtn"> 
                  <li> <div class="palette d-none" id="coolPalette"></div>  </li> 
                </ul>
              </div>
               <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                id="primaryBtn">
                                 <i class="fas fa-home primary-icon"></i>
                Primary Colors</button>
                <!-- primaryPalette -->
                 <ul class="dropdown-menu " aria-labelledby="primaryBtn"> 
                  <li> <div class="palette d-none" id="primaryPalette"></div>  </li> 
                </ul>
              </div>
               <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                id="secondaryBtn">
                 <i class="fas fa-heart text-secondary"></i>
                Secondary Colors</button>
                 <ul class="dropdown-menu " aria-labelledby="secondaryBtn"> 
                  <li> <div class="palette d-none" id="secondaryPalette"></div>  </li> 
                </ul>
              </div>
              
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="sunsetBtn">
                  <i class="fa-solid fa-sun"></i>
                  Sunset Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="sunsetBtn"> 
                  <li> <div class="palette d-none" id="sunsetPalette"></div>  </li> 
                </ul>
              </div>
            </div>
          </div>
          <div class="carousel-item">
            <div class="d-flex justify-content-around">
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="floralBtn">
                  <i class="fa-solid fa-leaf"></i>
                  floral colors</button>
                  <ul class="dropdown-menu " aria-labelledby="floralBtn"> 
                  <li> <div class="palette d-none" id="floralPalette"></div>  </li> 
                </ul>
              </div>  
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="galaxyBtn">
                <i class="fa-solid fa-galaxy"></i>
                  galaxy Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="galaxyBtn"> 
                  <li> <div class="palette d-none" id="galaxyPalette"></div>  </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="autumnBtn">
                <i class="fas fa-leaf"></i>
                 autumn Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="sunsetBtn"> 
                  <li> <div class="palette d-none" id="autumnPalette"></div>  </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="springBtn">
<i class="fas fa-seedling"></i>
                 Spring Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="springtBtn"> 
                  <li> <div class="palette d-none" id="springPalette"></div>  </li> 
                </ul>
              </div>
               <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="rainyBtn">
                  <i class="fa-solid fa-waterdrop"></i>
                 Rainy Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="rainytBtn"> 
                  <li> <div class="palette d-none" id="rainyPalette"></div>  </li> 
                </ul>
              </div>
              <div class="col-2 col-sm-2 col-md-2 col-lg-2 dropdown">
                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" 
                  id="winterBtn">
                  <i class="fa-solid fa-cloud"></i>
                 Winter Colors</button>
                  <ul class="dropdown-menu " aria-labelledby="wintertBtn"> 
                  <li> <div class="palette d-none" id="winterPalette"></div>  </li> 
                </ul>
              </div>
            </div>
          </div>
        </div>
       
        <button
          class="carousel-control-next bg-warning"
          type="button"
          data-bs-target="#colorMenuCarousel"
          data-bs-slide="next"
          aria-label="Next slide"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

   

    <div class="row mt-0" id="BoxElements">
      <div class="col-lg-2 col-md-2 col-sm-6 col-6 order-lg-1 order-md-1 order-2 m-0 d-none d-md-block"  id="LeftPart">
        <!-- background color layer -->
        <div class="p-1">
          <label for="bgColor">
            <h6>Background</h6>
          </label>
          <br />
          <input
            type="color"
            id="bgColor"
            value="#ffffff"
            class="text btn col-lg-6 col-md-6 col-sm-6 col-xs-6"
          />
        </div>
        <!-- forground color layer -->
        <div class="p-1">
          <label for="textColor">
            <h6>Forground</h6>
          </label>
          <br />
          <input
            type="color"
            id="textColor"
            value="#000000"
            class="btn col-lg-6 col-md-6 col-sm-6 col-xs-6"
          />
        </div>

        <!-- gradStart -->
        <div class="p-1">
          <label for="gradStart">
            <h6>Gradient Start</h6>
          </label>
          <br />
          <input
            type="color"
            id="gradStart"
            value="#8fcce0"
            class="btn col-lg-6 col-md-6 col-sm-6 col-xs-6"
          />
        </div>
        <div class="p-1">
          <label for="gradEnd"><h6>Gradient End</h6></label>
          <br />
          <input
            type="color"
            id="gradEnd"
            value="#e5b3e6"
            class="btn col-lg-6 col-md-6 col-sm-6 col-xs-6"
          />
        </div>
        <button
          type="button"
          class="btn btn-outline-dark text"
          id="applyGradient"
        >
          <h6 class="text text-center">Apply Gradient</h6>
        </button>

        <hr />
        <div id="cssOutput"></div>

        <div class="p-3">
          <!-- rgb(101, 207, 101) -->
          <div class="palette d-none" id="paletteContainer"></div>
        </div>
      </div>
      <div class="col-lg-8 col-md-8 col-sm-12 col-12 order-lg-2 order-md-2 order-1 m-0" id="MiddlePart">
        <h3 class="text mt-5 center">CONTRAST CHEAKER</h3>
        <textarea
          class="form-control plain-textarea mt-2"
          rows="50"
          placeholder="Type your paragraph here..."
        ></textarea>



      </div>
      <div class="col-lg-2 col-md-2 col-sm-6 col-6 order-lg-3 order-md-2 order-3 m-0 d-none d-md-block rightPart">
        <!-- Surprise Me -->
        <div>
          <!-- Toggle Button -->
<button class=" mt-2 btn btn-outline-dark" id="toggleBlindness">
   <span class="phase-short-title" id="phaseTitle">Blindness Mode</span>
  <i class="fa-solid fa-eye"></i>
</button>

<!-- Sidebar -->
<div id="blindnessSidebar" class="blind-sidebar">
  <button class="btn btn-sm btn-dark close-btn" id="closeBlindness">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <h6 class="fw-bold text-primary text-center mt-2">Color Blindness Modes</h6>
  <ul class="list-group list-group-flush">
    <li class="list-group-item p-2 blind-preview" id="vision-normal">👁️ Normal</li>
    <li class="list-group-item p-2 blind-preview" id="vision-deuteranomaly">👁️ Deuteranomaly</li>
    <li class="list-group-item p-2 blind-preview" id="vision-protanomaly">👁️ Protanomaly</li>
    <li class="list-group-item p-2 blind-preview" id="vision-deuteranopia">👁️ Deuteranopia</li>
    <li class="list-group-item p-2 blind-preview" id="vision-protanopia">👁️ Protanopia</li>
    <li class="list-group-item p-2 blind-preview" id="vision-tritanomaly">👁️ Tritanomaly</li>
    <li class="list-group-item p-2 blind-preview" id="vision-tritanopia">👁️ Tritanopia</li>
    <li class="list-group-item p-2 blind-preview" id="vision-mono">👁️ Monochromacy</li>
  </ul>
</div>

<!-- Right-side Preview Window -->
<div id="phasePreviewWindow" class="phase-preview">
  <button class="btn btn-sm btn-dark close-btn" id="closePhasePreview">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <h6 class="fw-bold text-primary text-center mt-2" id="phaseTitle">Phase Preview</h6>
  <!-- Textarea inside preview -->
  <textarea id="phaseText" class="form-control mt-3" rows="12"
    placeholder="Paste your text here to preview contrast..."></textarea>
</div>

          <h6 class="mt-5 text-primary fw-bold">SURPRISE ME</h6>
          <button type="button" class="btn custom-btn" id="randomize" aria-label="Randomize">
            <i class="fa-solid fa-dice"></i>
          </button>
        </div>

        <!-- Save Palette -->
        <div>
          <h6 class="text-primary fw-bold">SAVE PALETTE</h6>
          <button type="button" class="btn custom-btn " id="savePalette" aria-label="Save palette">
            <!-- <i class="fa-solid fa-cloud-arrow-down"></i> -->
          </button>
        </div>
        <!-- CSS Output -->
        <div class=" mt-4">
          <svg viewBox="0 0 36 36" class="circular-chart img-fluid col-lg-8 col-md-6 col-sm-4 col-4">
            <path
              class="circle-bg"
              d="M18 2.0845
       a 15.9155 15.9155 0 0 1 0 31.831
       a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <path
              id="progress"
              class="circle"
              stroke-dasharray="0, 100"
              d="M18 2.0845
       a 15.9155 15.9155 0 0 1 0 31.831
       a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <text x="18" y="20.35" id="ratioText" class="percentage">0:1</text>
          </svg>

          <p class="text text-center " id="contrast" >
            BEST COLOR CONTRAST
          </p>
          <p id="result"></p>
        </div>
      </div>
      <!-- Mobile Bottom Nav -->
<!-- Mobile Bottom Nav -->
<nav class="navbar fixed-bottom bg-light d-flex justify-content-around d-md-none">
  <!-- Background -->
  <div class="d-flex flex-column align-items-center">
    <button id="bgIcon" class="btn p-0"><i class="fas fa-fill-drip fa-lg"></i></button>
    <input type="color" id="bgColorMobile" style="display:none;" />
  </div>

  <!-- Text -->
  <div class="d-flex flex-column align-items-center">
    <button id="textIcon" class="btn p-0"><i class="fas fa-font fa-lg"></i></button>
    <input type="color" id="textColorMobile" style="display:none;" />
  </div>

  <!-- Gradient -->
  <div class="d-flex flex-column align-items-center">
    <button id="gradIcon" class="btn p-0"><i class="fas fa-palette fa-lg"></i></button>
    <div id="gradInputs" style="display:none;">
      <input type="color" id="gradStartMobile" />
      <input type="color" id="gradEndMobile" />
    </div>
  </div>

  <!-- Randomize -->
  <div class="d-flex flex-column align-items-center">
    <button id="randomizeMobile" class="btn p-0"><i class="fas fa-dice fa-lg"></i></button>
  </div>

  <!-- Save Palette -->
  <div class="d-flex flex-column align-items-center">
    <button id="savePaletteMobile" class="btn p-0">
      <!-- <i class="fas fa-cloud-arrow-down fa-lg"></i></button> -->
  </div>
</nav>


    </div>

   <script src="ColorContrastFunctions.js"></script>
  </body>
</html>
